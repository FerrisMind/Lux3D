# Lux3D / candle-3d release binaries
#
# Packaging model: llama.cpp — binaries and the CUDA runtime are separate
# archives. CUDA builds contain no NVIDIA libraries; users extract the matching
# cudart-* archive next to the binaries ($ORIGIN rpath on Linux).
#
# Asset naming: llama.cpp style with the version/tag embedded:
#   lux3d-<tag>-bin-win-{cpu,cuda-<cuda>,vulkan}-x64.zip
#   cudart-lux3d-<tag>-bin-win-cuda-<cuda>-x64.zip
#   lux3d-<tag>-bin-ubuntu-x64-{cpu,cuda-<cuda>,vulkan}.tar.gz
#   cudart-lux3d-<tag>-bin-ubuntu-x64-cuda-<cuda>.tar.gz
#
# The cudart archives ship only the user-space libraries the binaries actually
# load: cudart, cublas, cublasLt (NEEDED by cublas) and curand, one copy each.
# libcuda.so.1 / nvcuda.dll come from the NVIDIA driver and are never bundled.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "b*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag embedded in asset names (e.g. v0.1.0 or b42). Empty → b<commit-count>."
        required: false
        default: ""
        type: string
      publish:
        description: "Publish / update a GitHub Release after builds succeed."
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Build the matrix but skip creating/updating the GitHub Release."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Broad enough for common consumer/datacenter GPUs; Candle embeds kernels for this SM.
  CUDA_COMPUTE_CAP: "86"
  CUDA_VERSION: "12.6.0"
  # Match ggml-org/llama.cpp Windows Vulkan CI pin
  # (.github/workflows/build-vulkan.yml / release.yml → VULKAN_VERSION).
  # Older pins (e.g. 1.3.296.0) 404 on Windows LunarG and curl saved ~100 B HTML,
  # so Start-Process failed with a bogus "not compatible with Windows".
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      publish: ${{ steps.ctx.outputs.publish }}
      cuda_label: ${{ steps.cuda.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        uses: ./.github/actions/get-tag-name
        with:
          version: ${{ inputs.version }}
      - name: Resolve CUDA label
        id: cuda
        shell: bash
        run: echo "label=$(printf '%s\n' "$CUDA_VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
      - name: Resolve publish flag
        id: ctx
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          publish=false
          if [[ "$DRY_RUN" == "true" ]]; then
            publish=false
          elif [[ "$EVENT_NAME" == "push" ]]; then
            publish=true
          elif [[ "$PUBLISH_INPUT" == "true" ]]; then
            publish=true
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 (${{ matrix.backend }})
    needs: preflight
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            features: ""
          - backend: cuda
            features: "cuda"
          - backend: vulkan
            features: "vulkan"
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      CUDA_LABEL: ${{ needs.preflight.outputs.cuda_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: win-${{ matrix.backend }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'
          use-github-cache: true

      - name: Setup Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        env:
          VULKAN_VERSION: ${{ env.VULKAN_SDK_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          curl.exe -fsSL -o $installer $url
          $len = (Get-Item $installer).Length
          if ($len -lt 10MB) {
            $bytes = [IO.File]::ReadAllBytes($installer)
            $preview = [Text.Encoding]::UTF8.GetString($bytes[0..([Math]::Min(200, $bytes.Length - 1))])
            throw "Vulkan SDK download too small ($len bytes) from $url — likely a 404/HTML page. Preview: $preview"
          }
          # MZ header: reject HTML/JSON masquerading as an installer.
          $fh = [IO.File]::OpenRead($installer)
          try {
            $magic = New-Object byte[] 2
            [void]$fh.Read($magic, 0, 2)
          } finally { $fh.Close() }
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) {
            throw "Vulkan SDK download is not a PE executable (missing MZ). url=$url size=$len"
          }
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
          $sdk = "C:\VulkanSDK\${env:VULKAN_VERSION}"
          if (-not (Test-Path $sdk)) { throw "Vulkan SDK missing after install: $sdk" }
          echo "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          echo "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Build
        shell: pwsh
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:FEATURES) {
            cargo build --locked --release `
              -p lux3d-cli --features $env:FEATURES `
              -p lux3d-server --features $env:FEATURES
          } else {
            cargo build --locked --release -p lux3d-cli -p lux3d-server
          }

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "lux3d-$env:TAG"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item target\release\lux3d-cli.exe $root
          Copy-Item target\release\lux3d-server.exe $root
          Copy-Item LICENSE $root
          Copy-Item README.md $root -ErrorAction SilentlyContinue

          $asset = "lux3d-$env:TAG-bin-win-${{ matrix.backend }}-x64.zip"
          if ("${{ matrix.backend }}" -eq "cuda") {
            $asset = "lux3d-$env:TAG-bin-win-cuda-$env:CUDA_LABEL-x64.zip"
          }
          if (Test-Path $asset) { Remove-Item $asset -Force }
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $asset
          echo "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Stage CUDA runtime (separate archive)
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cudartRoot = Join-Path $env:RUNNER_TEMP "cudart-lux3d-$env:TAG"
          New-Item -ItemType Directory -Force -Path $cudartRoot | Out-Null
          $cudaBin = Join-Path $env:CUDA_PATH "bin"

          # Only the DLLs the binaries load, plus cublasLt because
          # cublas64_12.dll imports it. No nvrtc: no runtime kernel compilation.
          $patterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "curand64_*.dll"
          )
          foreach ($pattern in $patterns) {
            Get-ChildItem $cudaBin -Filter $pattern -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $cudartRoot -Force
          }
          foreach ($pattern in $patterns) {
            if (-not (Get-ChildItem $cudartRoot -Filter $pattern -File -ErrorAction SilentlyContinue)) {
              throw "CUDA runtime DLL missing: $pattern (searched $cudaBin)"
            }
          }

          $cudartAsset = "cudart-lux3d-$env:TAG-bin-win-cuda-$env:CUDA_LABEL-x64.zip"
          if (Test-Path $cudartAsset) { Remove-Item $cudartAsset -Force }
          Compress-Archive -Path (Join-Path $cudartRoot "*") -DestinationPath $cudartAsset
          echo "CUDART_ASSET=$cudartAsset" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: lux3d-${{ env.TAG }}-bin-win-${{ matrix.backend }}-x64
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'cuda'
        with:
          name: cudart-lux3d-${{ env.TAG }}-bin-win-cuda-${{ env.CUDA_LABEL }}-x64
          path: ${{ env.CUDART_ASSET }}
          if-no-files-found: error

  ubuntu:
    name: Ubuntu x64 (${{ matrix.backend }})
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            features: ""
          - backend: cuda
            features: "cuda"
          - backend: vulkan
            features: "vulkan"
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      CUDA_LABEL: ${{ needs.preflight.outputs.cuda_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.backend }}

      - name: Install pack helpers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils patchelf zip

      - name: Setup CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          # network pulls nvidia-dkms and fails on Azure kernels (no GPU).
          # local .run with --toolkit installs nvcc/libs only.
          method: local
          linux-local-args: '["--toolkit"]'
          use-github-cache: true

      - name: Setup Vulkan SDK
        if: matrix.backend == 'vulkan'
        env:
          VULKAN_VERSION: ${{ env.VULKAN_SDK_VERSION }}
        run: |
          set -eo pipefail
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
          wget -q "$url" -O /tmp/vulkan.tar.xz
          size=$(stat -c%s /tmp/vulkan.tar.xz)
          if (( size < 10485760 )); then
            echo "Vulkan SDK download too small (${size} bytes) from ${url}" >&2
            head -c 200 /tmp/vulkan.tar.xz >&2 || true
            exit 1
          fi
          mkdir -p "$HOME/vulkan"
          tar -xJf /tmp/vulkan.tar.xz -C "$HOME/vulkan"
          sdk="$HOME/vulkan/${VULKAN_VERSION}"
          # LunarG setup-env.sh references $1; set -u would abort on source.
          # shellcheck disable=SC1091
          set +u
          source "$sdk/setup-env.sh"
          set -u
          echo "VULKAN_SDK=$VULKAN_SDK" >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"
          echo "VK_LAYER_PATH=$VULKAN_SDK/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc || true

      - name: Build
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          if [[ -n "$FEATURES" ]]; then
            cargo build --locked --release \
              -p lux3d-cli --features "$FEATURES" \
              -p lux3d-server --features "$FEATURES"
          else
            cargo build --locked --release -p lux3d-cli -p lux3d-server
          fi

      - name: Strip debug info
        run: |
          set -euo pipefail
          # Linux ELF embeds DWARF (Cargo debug = "line-tables-only" plus C/C++
          # dependency info); Windows keeps it in a PDB that is not packaged.
          # --strip-debug removes DWARF but keeps .symtab, so panic backtraces
          # still show function names, just without file:line.
          strip --strip-debug target/release/lux3d-cli target/release/lux3d-server
          for bin in target/release/lux3d-cli target/release/lux3d-server; do
            if readelf -S "$bin" | grep -qE '\.debug_(info|line|str|ranges|loc)'; then
              echo "debug sections remain in $bin" >&2
              exit 1
            fi
          done

      - name: Stage package
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lux3d-${TAG}"
          mkdir -p "$root"
          cp target/release/lux3d-cli target/release/lux3d-server "$root/"
          cp LICENSE "$root/"
          cp README.md "$root/" 2>/dev/null || true

          if [[ "${{ matrix.backend }}" == "cuda" ]]; then
            # CUDA libraries are shipped separately in cudart-*; extract that
            # archive into this directory so $ORIGIN finds them.
            for bin in lux3d-cli lux3d-server; do
              patchelf --set-rpath '$ORIGIN' "$root/$bin"
            done
          fi

          asset="lux3d-${TAG}-bin-ubuntu-x64-${{ matrix.backend }}.tar.gz"
          if [[ "${{ matrix.backend }}" == "cuda" ]]; then
            asset="lux3d-${TAG}-bin-ubuntu-x64-cuda-${CUDA_LABEL}.tar.gz"
          fi
          tar -czvf "$asset" -C "$RUNNER_TEMP" "lux3d-${TAG}"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Stage CUDA runtime (separate archive)
        if: matrix.backend == 'cuda'
        run: |
          set -euo pipefail
          cuda_lib="${CUDA_PATH:-/usr/local/cuda}/lib64"
          cuda_major="${CUDA_VERSION%%.*}"
          cudart_root="$RUNNER_TEMP/cudart/lux3d-${TAG}"
          mkdir -p "$cudart_root"

          # Exactly the user-space libs the binaries load. cublas NEEDs
          # cublasLt; nvrtc/nvJitLink/nvrtc-builtins are not imported at all.
          # curand ABI is 10 for the pinned CUDA 12.x toolkit.
          libs=(
            "libcudart.so.${cuda_major}"
            "libcublas.so.${cuda_major}"
            "libcublasLt.so.${cuda_major}"
            "libcurand.so.10"
          )
          for so in "${libs[@]}"; do
            if [[ ! -e "$cuda_lib/$so" ]]; then
              echo "missing $cuda_lib/$so" >&2
              ls -la "$cuda_lib" 2>/dev/null | head -n 50 >&2 || true
              exit 1
            fi
            # -L dereferences the SONAME symlink into one plain file. No
            # libfoo.so / libfoo.so.12 / libfoo.so.12.6.x triple copies.
            cp -Lv "$cuda_lib/$so" "$cudart_root/"
          done

          mapfile -t staged < <(find "$cudart_root" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ ${#staged[@]} -ne 4 ]]; then
            printf 'expected 4 CUDA runtime libs, got %d:\n%s\n' "${#staged[@]}" "${staged[*]}" >&2
            exit 1
          fi
          for lib in "$cudart_root"/*.so.*; do
            missing="$(LD_LIBRARY_PATH="$cudart_root" ldd "$lib" | awk '/not found/{print $1}')"
            if [[ -n "$missing" ]]; then
              echo "missing dependencies for $lib: $missing" >&2
              exit 1
            fi
          done

          cudart_asset="cudart-lux3d-${TAG}-bin-ubuntu-x64-cuda-${CUDA_LABEL}.tar.gz"
          tar -czvf "$cudart_asset" -C "$RUNNER_TEMP/cudart" "lux3d-${TAG}"
          echo "CUDART_ASSET=${cudart_asset}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: lux3d-${{ env.TAG }}-bin-ubuntu-x64-${{ matrix.backend }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'cuda'
        with:
          name: cudart-lux3d-${{ env.TAG }}-bin-ubuntu-x64-cuda-${{ env.CUDA_LABEL }}
          path: ${{ env.CUDART_ASSET }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [preflight, windows, ubuntu]
    if: ${{ needs.preflight.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      CUDA_LABEL: ${{ needs.preflight.outputs.cuda_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure git tag exists
        if: ${{ github.ref_type != 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -exec mv -t release {} +
          ls -la release

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*
          body: |
            Lux3D / candle-3d binaries (llama.cpp packaging: CUDA runtime is a separate archive).

            **CUDA runtime (required for CUDA builds)**

            Extract the matching `cudart-*` archive next to `lux3d-cli` / `lux3d-server`
            (same directory as the `.exe`; `$ORIGIN` on Linux). The host only needs the
            NVIDIA driver (`libcuda.so.1` / `nvcuda.dll`); a full CUDA toolkit is not required.

            **Windows x64**
            - [CPU](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/lux3d-${{ env.TAG }}-bin-win-cpu-x64.zip)
            - [CUDA binaries](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/lux3d-${{ env.TAG }}-bin-win-cuda-${{ env.CUDA_LABEL }}-x64.zip)
            - [CUDA runtime](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/cudart-lux3d-${{ env.TAG }}-bin-win-cuda-${{ env.CUDA_LABEL }}-x64.zip)
            - [Vulkan](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/lux3d-${{ env.TAG }}-bin-win-vulkan-x64.zip)

            **Ubuntu x64**
            - [CPU](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/lux3d-${{ env.TAG }}-bin-ubuntu-x64-cpu.tar.gz)
            - [CUDA binaries](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/lux3d-${{ env.TAG }}-bin-ubuntu-x64-cuda-${{ env.CUDA_LABEL }}.tar.gz)
            - [CUDA runtime](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/cudart-lux3d-${{ env.TAG }}-bin-ubuntu-x64-cuda-${{ env.CUDA_LABEL }}.tar.gz)
            - [Vulkan](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/lux3d-${{ env.TAG }}-bin-ubuntu-x64-vulkan.tar.gz)
